apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: release
spec:
  pipelineSpec:
    tasks:
    - name: from-build-pack
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          image: uses:vexcel-data/jx3-tekton-catalog/agent/0.1/release.yaml@versionStream
          name: ""
          resources:
            limits: {}
          workingDir: /workspace/source
        steps:
        - image: uses:vexcel-data/jx3-tekton-catalog/task/git/0.1/gitclone.yaml@versionStream
          name: ""
          resources: {}
        - image: uses:vexcel-data/jx3-tekton-catalog/task/release-version/0.1/nextversion-master-minor.yaml@versionStream
          name: "nextversion-master-minor"
          resources: {}
        - name: jx-variables
          resources: {}
        - image: uses:vexcel-data/jx3-tekton-catalog/task/python/0.1/make-pip-settings-cda-releases.yaml@versionStream
          name: ""
          resources: {}
        - image: public.ecr.aws/lts/ubuntu:24.04_stable
          name: python-running-build-tests
          resources: {}
          script: |
            #!/bin/sh
            set -e
            export DEBIAN_FRONTEND=noninteractive
            ln -fs /usr/share/zoneinfo/Europe/Madrid /etc/localtime
            . .jx/variables.sh
            cp pip.conf /etc/ #copy generated pip.conf from previous step make-pip-settings-cda-snapshots.yaml
            apt-get update -y
            apt-get install --no-install-recommends -y build-essential python3 python3-dev python3-pip python3-venv libpq-dev

            export PYTHONPATH=$PYTHONPATH:$PWD
            python3 -m venv .venv
            . .venv/bin/activate
            python3 -m pip install -r requirements.txt --no-cache-dir
            rm -rf .venv
        - image: uses:vexcel-data/jx3-tekton-catalog/task/python/0.1/codeartifact-token-releases.yaml@versionStream
          name: ""
          resources: {}
        - image: public.ecr.aws/docker/library/python:3.10
          name: build-python-push-cda
          resources: { }
          script: |
            #!/bin/sh
            set -xe
            . .jx/variables.sh
            if [ -e pip.conf ]; then
              cp pip.conf /etc/ #copy generated pip.conf from previous steps
            fi
            PACKAGE_NAME=yolov9_vx
            sed -i "s/REPLACE/${VERSION}/g" $PACKAGE_NAME/__init__.py
            sed -i "s/TIMESTAMP/`date -Iseconds`/g" $PACKAGE_NAME/__init__.py
            cp /root/.pypirc/.pypirc /tekton/home/
            pip install wheel twine packaging # 'urllib3<2' to avoid DEFAULT_CIPHERS error https://github.com/Yelp/elastalert/issues/2306
            python3 build_wheel.py
            twine upload -r aws dist/* --verbose --non-interactive     
        - name: promote-changelog
          resources: {}
  podTemplate: {}
  serviceAccountName: tekton-bot
  timeout: 1h0m0s
status: {}
